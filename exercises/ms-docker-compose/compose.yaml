# Starting point: three services without health checks.
# Pitfall: depends_on without a condition only waits for the container to start, not for a ready service.
# Start: docker compose -f exercises/ms-docker-compose/compose.yaml up --build
name: werkstatt-uebung

services:
  catalog:
    build: { context: ../.., args: { SERVICE: catalog } }
    environment: { PORT: '3001' }
    ports: ['3001:3001']
    # TODO: healthcheck on http://localhost:3001/health/ready

  inventory:
    build: { context: ../.., args: { SERVICE: inventory } }
    environment: { PORT: '3003', SUBSCRIBERS: 'http://orders:3002/inbox' }
    ports: ['3003:3003']
    # TODO: healthcheck on http://localhost:3003/health/ready

  orders:
    build: { context: ../.., args: { SERVICE: orders } }
    environment:
      PORT: '3002'
      CATALOG_URL: http://catalog:3001
      SUBSCRIBERS: http://inventory:3003/inbox
    ports: ['3002:3002']
    depends_on: [catalog, inventory]
    # TODO: healthcheck and depends_on with condition: service_healthy
