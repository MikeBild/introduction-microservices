# Startpunkt: drei Services ohne Health Checks.
# Fallstrick: depends_on ohne condition wartet nur auf den Containerstart, nicht auf einen bereiten Service.
# Starten: docker compose -f exercises/ms-docker-compose/compose.yaml up --build
name: werkstatt-uebung

services:
  catalog:
    build: { context: ../.., args: { SERVICE: catalog } }
    environment: { PORT: '3001' }
    ports: ['3001:3001']
    # TODO: healthcheck auf http://localhost:3001/health/ready

  inventory:
    build: { context: ../.., args: { SERVICE: inventory } }
    environment: { PORT: '3003', SUBSCRIBERS: 'http://orders:3002/inbox' }
    ports: ['3003:3003']
    # TODO: healthcheck auf http://localhost:3003/health/ready

  orders:
    build: { context: ../.., args: { SERVICE: orders } }
    environment:
      PORT: '3002'
      CATALOG_URL: http://catalog:3001
      SUBSCRIBERS: http://inventory:3003/inbox
    ports: ['3002:3002']
    depends_on: [catalog, inventory]
    # TODO: healthcheck und depends_on mit condition: service_healthy
